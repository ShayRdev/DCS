<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="780" viewBox="0 0 1100 780">
  <defs>
    <style>
      .title { font: 700 18px 'IBM Plex Sans', Arial, sans-serif; fill: #1a1a1a; }
      .sub { font: 500 12px 'IBM Plex Sans', Arial, sans-serif; fill: #333; }
      .label { font: 600 12px 'IBM Plex Sans', Arial, sans-serif; fill: #111; }
      .small { font: 400 11px 'IBM Plex Mono', monospace; fill: #222; }
      .hdr { font: 700 12px 'IBM Plex Sans', Arial, sans-serif; fill: #111; }
      .box { fill: #f7f7f4; stroke: #111; stroke-width: 1.5; }
      .pin { fill: #fff; stroke: #111; stroke-width: 1.2; }
      .tb { fill: #efefea; stroke: #111; stroke-width: 1; }
    </style>
  </defs>

  <rect x="24" y="24" width="1052" height="732" fill="#fbfbf8" stroke="#111" stroke-width="2"/>
  <rect x="24" y="24" width="1052" height="56" fill="#ecece6" stroke="#111" stroke-width="2"/>
  <text class="title" x="40" y="48">DCS  Pinout &amp; Breadboard Connections</text>
  <text class="sub" x="40" y="68">Exact wiring for Pi GPIO header, ADS1115, shunt, and Rosemount loop</text>

  <!-- Title block -->
  <g transform="translate(740,640)">
    <rect class="tb" x="0" y="0" width="312" height="92"/>
    <line x1="0" y1="28" x2="312" y2="28" stroke="#111"/>
    <line x1="0" y1="56" x2="312" y2="56" stroke="#111"/>
    <line x1="160" y1="0" x2="160" y2="92" stroke="#111"/>
    <text class="small" x="8" y="18">DOCUMENT</text>
    <text class="label" x="8" y="46">SCH-DCS-002</text>
    <text class="small" x="168" y="18">REVISION</text>
    <text class="label" x="168" y="46">A</text>
    <text class="small" x="8" y="74">DATE 2026-09-27</text>
    <text class="small" x="168" y="74">SHEET 2 OF 2</text>
  </g>

  <!-- Pi header table -->
  <text class="hdr" x="60" y="120">RASPBERRY PI 40-PIN (BCM)</text>
  <rect class="box" x="60" y="130" width="420" height="220"/>
  <text class="small" x="80" y="158">Pi pin 1  (3V3)     í  ADS1115 VDD</text>
  <text class="small" x="80" y="180">Pi pin 3  (GPIO2/SDA) í  ADS1115 SDA</text>
  <text class="small" x="80" y="202">Pi pin 5  (GPIO3/SCL) í  ADS1115 SCL</text>
  <text class="small" x="80" y="224">Pi pin 6  (GND)     í  ADS1115 GND ∑ shunt low</text>
  <text class="small" x="80" y="246">Pi pin 11 (GPIO17)  í  Relay IN (pump, optional)</text>
  <text class="small" x="80" y="278">ADDR: ADS1115 ADDR í GND  “  0x48</text>
  <text class="small" x="80" y="300">I≤C bus: 1   (`i2cdetect -y 1`)</text>
  <text class="small" x="80" y="328">Pull-ups: onboard on Adafruit ADS1115 breakout</text>

  <!-- ADS1115 pins -->
  <text class="hdr" x="540" y="120">ADS1115 BREAKOUT</text>
  <rect class="box" x="540" y="130" width="420" height="220"/>
  <text class="small" x="560" y="158">VDD  ê  3V3</text>
  <text class="small" x="560" y="180">GND  ê  Pi GND / shunt low</text>
  <text class="small" x="560" y="202">SCL  ê  GPIO3</text>
  <text class="small" x="560" y="224">SDA  ê  GPIO2</text>
  <text class="small" x="560" y="246">ADDR ê  GND (0x48)</text>
  <text class="small" x="560" y="268">AIN0 ê  shunt high (sense +)</text>
  <text class="small" x="560" y="290">AIN1..3 unused (tie to GND optional)</text>
  <text class="small" x="560" y="322">PGA: ±4.096 V (software default)</text>

  <!-- Loop / shunt -->
  <text class="hdr" x="60" y="390">420 mA LOOP / SHUNT</text>
  <rect class="box" x="60" y="400" width="900" height="150"/>
  <text class="small" x="80" y="430">+24 VDC  í  Rosemount + (loop supply positive)</text>
  <text class="small" x="80" y="452">Rosemount   í  shunt high  í  ADS1115 AIN0</text>
  <text class="small" x="80" y="474">shunt low  í  24 VDC   AND  ADS1115 GND / Pi GND (single star point)</text>
  <text class="small" x="80" y="496">Rs = 100 © 0.1% metal film   “   4 mAí0.40 V   20 mAí2.00 V</text>
  <text class="small" x="80" y="526">Scale in software: LRV ∞C @ 4 mA, URV ∞C @ 20 mA (defaults 0100 ∞C)</text>

  <!-- Assembly options -->
  <text class="hdr" x="60" y="580">ASSEMBLY OPTIONS</text>
  <text class="small" x="60" y="602">A. Breadboard  Pi cobbler, ADS1115 module, shunt across AIN0/GND rails, Dupont to transmitter terminals.</text>
  <text class="small" x="60" y="622">B. Soldered / flex proto  same netlist; mount ADS1115 + Rs on proto or flex PCB; screw terminals for loop.</text>
  <text class="small" x="60" y="642">C. 5 V ADS only  power ADS from 5 V and pass SDA/SCL through Adafruit 757 level shifter to Pi 3V3 I≤C.</text>
</svg>
